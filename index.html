<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Flexbox practice</title>
    <link rel="stylesheet" href="styles.css">  
    <head>
        <body>

        </body>
        </html>

        <h1 id="page-title">VIP Registration</h1>

        <p class="info text">Please complete all required fields.</p>
         <p class="info text">Double check your email before submitting.</p>

<form action="#" method="POST" class="form-card">
    <h2>Event Sign-Up</h2>
       

         <div class="form-group">
            <label for="userEmail"> Email Address </label>
            <input type ="email" id="userEmail" name="userEmail" placeholder="e.g., dogedogedoge@gmail.com" required>

        </div>

        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="e.g., Doge Kabosu" required>
        </div>

        <div class="form-group">
            <label for="birthDate">Birth Date:</label>
            <input type="date" id="birthDate" name="birthDate" required>
        </div>


        <div class="form-group"></div>

        <label> For User Notes Special Requests:</label>
        <textarea id="userNotes" 
        name="userNotes"
         rows="3"
            placeholder="Enter dietary or seating needs">
        </textarea>
    </div>
 
    <div class="form-group">
    <label>Ticket Tier:</label>
    <div class="option-group">
 <input type="radio" id="tierPass" name="ticket" value="standard" required>
<label for="tierPass"></label> Standard</label>
<input type="radio" id="tierVIP" name="ticket" value="vip">
<label for="tierVIP"></label>VIP Pass</label>


</div>

</div>

<label>Dietary Preferences:</label>
<div class="option-group">
<input type="checkbox" id="veg" name="diet" value="vegetarian">
<label for="veg"></label> Vegetarian</label >
</div>
</div>

        
</div>
</div>

<div class="form-group"></div>
<label for="tshirt">T-Shirt Size:</label>
<select id="tshirt" name="tshirt" required>
<option value="'" disabled selected>Select your size...

<option value="s">Small</option>
 <option value="m">Medium</option>
<option value="1">Large</option>
</select>
</div>

<button type="submit" class="submit-btn"></button>Submit Registration</button>
       

</form>
</body>
</html>
